<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradNum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0812"/>
      <stop offset="100%" stop-color="#150f24"/>
    </linearGradient>
    <pattern id="gridNum" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(168, 85, 247, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradNum)"/>
  <rect width="800" height="450" fill="url(#gridNum)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect x="25" y="25" width="750" height="400" fill="none" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Corner Crosses -->
  <path d="M 15 20 L 25 20 M 20 15 L 20 25" stroke="#c084fc" stroke-width="2"/>
  <path d="M 775 20 L 785 20 M 780 15 L 780 25" stroke="#c084fc" stroke-width="2"/>
  <path d="M 15 430 L 25 430 M 20 425 L 20 435" stroke="#c084fc" stroke-width="2"/>
  <path d="M 775 430 L 785 430 M 780 425 L 780 435" stroke="#c084fc" stroke-width="2"/>

  <!-- Header Badge -->
  <rect x="40" y="40" width="280" height="26" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="50" y="58" fill="#e9d5ff" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">NUMERICAL_ANALYSIS::CORE_CS</text>
  <text x="740" y="58" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="11">RK4 // GAUSS // FINITE_DIFF</text>

  <!-- Title -->
  <text x="40" y="105" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="900" letter-spacing="0.5">SCIENTIFIC COMPUTING &amp; ALGORITHM ENGINE</text>
  <text x="40" y="128" fill="#94a3b8" font-family="monospace" font-size="12">CONTINUOUS MATHEMATICAL MODELING FOR PHYSICS, GRAPHICS &amp; SIMULATION</text>

  <!-- Left Block: Differential & Root Solvers -->
  <g transform="translate(50, 160)">
    <rect width="325" height="210" fill="#0f0c1b" stroke="#a855f7" stroke-width="1.5" rx="4"/>
    <rect x="0" y="0" width="325" height="32" fill="#3b0764" rx="4"/>
    <text x="15" y="21" fill="#e9d5ff" font-family="monospace" font-size="12" font-weight="bold">MODULE_01: ODES &amp; ROOT FINDING</text>
    
    <text x="15" y="60" fill="#cbd5e1" font-family="monospace" font-size="11">• 4th-Order Runge-Kutta (RK4 Solver)</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="monospace" font-size="11">• Newton-Raphson &amp; Fixed-Point Roots</text>
    <text x="15" y="110" fill="#cbd5e1" font-family="monospace" font-size="11">• Predictor-Corrector Multi-Step</text>
    <text x="15" y="135" fill="#cbd5e1" font-family="monospace" font-size="11">• Dynamic Step-Size Convergence</text>

    <!-- Mathematical Visual: Curve with Tangents -->
    <path d="M 30 190 Q 120 140, 200 170 T 300 145" fill="none" stroke="#c084fc" stroke-width="2.5"/>
    <line x1="30" y1="195" x2="300" y2="195" stroke="#475569" stroke-width="1"/>
    <circle cx="160" cy="155" r="4" fill="#f43f5e"/>
    <line x1="130" y1="180" x2="200" y2="135" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="210" y="140" fill="#fda4af" font-family="monospace" font-size="9">dy/dx = f(x,y)</text>
  </g>

  <!-- Right Block: Linear Algebra & Quadrature -->
  <g transform="translate(425, 160)">
    <rect width="325" height="210" fill="#0f0c1b" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
    <rect x="0" y="0" width="325" height="32" fill="#164e63" rx="4"/>
    <text x="15" y="21" fill="#67e8f9" font-family="monospace" font-size="12" font-weight="bold">MODULE_02: LINEAR SYSTEMS &amp; INTEGRATION</text>
    
    <text x="15" y="60" fill="#cbd5e1" font-family="monospace" font-size="11">• Gaussian Elimination (Partial Pivot)</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="monospace" font-size="11">• Newton-Gregory Finite Differences</text>
    <text x="15" y="110" fill="#cbd5e1" font-family="monospace" font-size="11">• Simpson 1/3, 3/8 &amp; Trapezoid Quad</text>
    <text x="15" y="135" fill="#cbd5e1" font-family="monospace" font-size="11">• Matrix Transformation Rigor (Ax = b)</text>

    <!-- Mathematical Visual: Matrix Grid -->
    <g transform="translate(70, 155)">
      <text x="0" y="16" fill="#a5f3fc" font-family="monospace" font-size="12" font-weight="bold">[ a₁₁  a₁₂ | b₁ ]</text>
      <text x="0" y="32" fill="#a5f3fc" font-family="monospace" font-size="12" font-weight="bold">[ 0    a₂₂ | b₂ ]</text>
      <text x="140" y="24" fill="#38bdf8" font-family="monospace" font-size="11">&#8594; x = A⁻¹b</text>
    </g>
  </g>

  <!-- Footer Tagline -->
  <text x="400" y="410" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">MATHEMATICAL RIGOR FOR SHADER GRAPHICS, SIMULATION &amp; APPLIED AI</text>
</svg>