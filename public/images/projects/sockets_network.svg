<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0e"/>
      <stop offset="100%" stop-color="#0f1720"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(34, 197, 94, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect x="25" y="25" width="750" height="400" fill="none" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Corner Crosses -->
  <path d="M 15 20 L 25 20 M 20 15 L 20 25" stroke="#4ade80" stroke-width="2"/>
  <path d="M 775 20 L 785 20 M 780 15 L 780 25" stroke="#4ade80" stroke-width="2"/>
  <path d="M 15 430 L 25 430 M 20 425 L 20 435" stroke="#4ade80" stroke-width="2"/>
  <path d="M 775 430 L 785 430 M 780 425 L 780 435" stroke="#4ade80" stroke-width="2"/>

  <!-- Header Badge -->
  <rect x="40" y="40" width="230" height="26" fill="#142e1b" stroke="#22c55e" stroke-width="1"/>
  <text x="50" y="58" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">PROTOCOL::RAW_SOCKETS</text>
  <text x="740" y="58" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="11">PORT: 55555 // AF_INET</text>

  <!-- Title -->
  <text x="40" y="105" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="900" letter-spacing="0.5">CONCURRENT NETWORK PROTOCOL ENGINE</text>
  <text x="40" y="128" fill="#94a3b8" font-family="monospace" font-size="12">DUAL ARCHITECTURE: TCP STREAM vs UDP DATAGRAM BROADCAST</text>

  <!-- Left Block: TCP -->
  <g transform="translate(50, 160)">
    <rect width="325" height="210" fill="#0d1117" stroke="#3b82f6" stroke-width="1.5" rx="4"/>
    <rect x="0" y="0" width="325" height="32" fill="#1e293b" rx="4"/>
    <text x="15" y="21" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="bold">PROTOCOL_A: TCP (SOCK_STREAM)</text>
    
    <text x="15" y="60" fill="#cbd5e1" font-family="monospace" font-size="11">• 3-Way Handshake Connection</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="monospace" font-size="11">• In-Order Reliable Packet Delivery</text>
    <text x="15" y="110" fill="#cbd5e1" font-family="monospace" font-size="11">• Thread-Safe Client Registry (Lock)</text>
    <text x="15" y="135" fill="#cbd5e1" font-family="monospace" font-size="11">• Graceful Disconnect Detection</text>

    <!-- Visual Diagram Flow -->
    <path d="M 30 170 L 295 170" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="30" cy="170" r="5" fill="#3b82f6"/>
    <circle cx="295" cy="170" r="5" fill="#3b82f6"/>
    <text x="162" y="162" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="9">SYN &#8594; SYN-ACK &#8594; ACK</text>
    <text x="162" y="195" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Guaranteed Stream Delivery</text>
  </g>

  <!-- Right Block: UDP -->
  <g transform="translate(425, 160)">
    <rect width="325" height="210" fill="#0d1117" stroke="#22c55e" stroke-width="1.5" rx="4"/>
    <rect x="0" y="0" width="325" height="32" fill="#142e1b" rx="4"/>
    <text x="15" y="21" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">PROTOCOL_B: UDP (SOCK_DGRAM)</text>
    
    <text x="15" y="60" fill="#cbd5e1" font-family="monospace" font-size="11">• Connectionless Datagram Broadcast</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="monospace" font-size="11">• Ultra-Low Latency Packet Push</text>
    <text x="15" y="110" fill="#cbd5e1" font-family="monospace" font-size="11">• (IP, Port) Stateless Client Mapping</text>
    <text x="15" y="135" fill="#cbd5e1" font-family="monospace" font-size="11">• Real-Time Game/Chat Telemetry</text>

    <!-- Visual Diagram Flow -->
    <path d="M 30 170 L 295 170" stroke="#22c55e" stroke-width="2"/>
    <polygon points="285,165 295,170 285,175" fill="#22c55e"/>
    <circle cx="30" cy="170" r="5" fill="#22c55e"/>
    <text x="162" y="162" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="9">SENDTO(ADDR) // NO-WAIT</text>
    <text x="162" y="195" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Zero Overhead Datagrams</text>
  </g>

  <!-- Footer Tagline -->
  <text x="400" y="410" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">MULTITHREADED PYTHON SOCKET ENGINE // SYSTEM ARCHITECTURE RESEARCH</text>
</svg>